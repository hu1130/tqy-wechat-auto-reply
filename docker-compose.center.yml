services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CENTER_DB_NAME:-wechat_ai}
      POSTGRES_USER: ${CENTER_DB_USER:-wechat_ai}
      POSTGRES_PASSWORD: ${CENTER_DB_PASSWORD:?CENTER_DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${CENTER_DB_PORT:-5432}:5432"
    volumes:
      - center_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  center_postgres_data:
